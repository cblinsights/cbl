<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBL Money Dashboard</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f5f6fa;
}

/* Top Bar */
.topbar {
    background: #4B0082;
    color: white;
    padding: 15px 20px;
    font-size: 20px;
    font-weight: bold;
}

/* Layout */
.container {
    display: flex;
}

/* Sidebar */
.sidebar {
    width: 220px;
    background: white;
    height: 100vh;
    padding: 20px;
    box-shadow: 2px 0 5px rgba(0,0,0,0.05);
}

.sidebar a {
    display: block;
    margin: 15px 0;
    text-decoration: none;
    color: #333;
    font-weight: bold;
    cursor: pointer;
}

.sidebar a:hover {
    color: #FF8C00;
}

/* Main Content */
.main {
    flex: 1;
    padding: 20px;
}

/* iframe (loads your tools) */
iframe {
    width: 100%;
    height: 80vh;
    border: none;
    background: white;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="topbar">
CBL Money
</div>

<div class="container">

<div class="sidebar">
<a onclick="loadPage('dashboard.html')">📊 Dashboard</a>
<a onclick="loadPage('debt-tracker.html')">💳 Debt Tracker</a>
</div>

<div class="main">
<h2>You've Got This! Master Your Finances One Tab At A Time</h2>
<p>Select a tool from the left to begin.</p>

<iframe id="frame"></iframe>
</div>

</div>

<script>
function loadPage(page){
document.getElementById("frame").src = page;
}
</script>

</body>
</html>
