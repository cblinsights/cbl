<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><img src="My files/Downloads/cbl logo.png" alt="Company Logo" width="100" height="auto">
</title>

<style>
:root {
    --purple: #4B0082;
    --orange: #FF8C00;
    --bg: #f5f6fa;
}

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: var(--bg);
}

/* Top Bar */
.topbar {
    background: linear-gradient(135deg, var(--purple), var(--orange));
    color: white;
    padding: 16px 24px;
    font-size: 20px;
    font-weight: 600;
}

/* Layout */
.container {
    display: flex;
}

/* Sidebar */
.sidebar {
    width: 240px;
    background: white;
    height: 100vh;
    padding: 20px;
    box-shadow: 2px 0 10px rgba(0,0,0,0.05);
}

.logo {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 30px;
    color: var(--purple);
}

.nav-item {
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 10px;
    cursor: pointer;
    font-weight: 500;
    transition: 0.2s;
}

.nav-item:hover {
    background: #f0e9ff;
}

.active {
    background: linear-gradient(135deg, var(--purple), var(--orange));
    color: white;
}

/* Main */
.main {
    flex: 1;
    padding: 25px;
}

/* Cards */
.card {
    background: purple;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}

/* Sections hidden by default */
.page {
    display: none;
}

.page.active {
    display: block;
}
</style>
</head>

<body>

<div class="topbar">
CBL Insights
</div>

<div class="container">

<div class="sidebar">
<div class="logo">CBL Money</div>

<div class="nav-item active" onclick="showPage('home', this)">🏠 Home</div>
<div class="nav-item" onclick="showPage('dashboard', this)">📊 Dashboard</div>
<div class="nav-item" onclick="showPage('debt', this)">💳 Debt Tracker</div>

</div>

<div class="main">

<!-- HOME -->
<div id="home" class="page active">
<div class="card">
<h2>Welcome</h2>
<p>This is your personal financial control center.</p>
<p>Use the sidebar to manage your money, track debt, and monitor spending.</p>
</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="page">
<div class="card">
<h2>Monthly Dashboard</h2>
<iframe src="dashboard.html" style="width:100%; height:600px; border:none;"></iframe>
</div>
</div>

<!-- DEBT -->
<div id="debt" class="page">
<div class="card">
<h2>Debt Tracker</h2>
<iframe src="debt-tracker.html" style="width:100%; height:600px; border:none;"></iframe>
</div>
</div>

</div>
</div>

<script>
function showPage(pageId, element){

// hide all pages
document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

// show selected
document.getElementById(pageId).classList.add('active');

// update nav styles
document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
element.classList.add('active');
}
</script>

</body>
</html>
